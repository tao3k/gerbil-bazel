name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_lock:
        description: Generate and verify the cross-platform Bazel module lock
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GERBIL_SOURCE_REVISION: 1cfb032c7a1612637da6205f5f8a15683eba3ba0
  GAMBIT_SOURCE_REVISION: ea114fc3d2f120abbe20393c1f9aeafdd3f8c89f

jobs:
  bazel:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.refresh_lock }}
    name: Bazel (${{ matrix.runner }}, ${{ matrix.gerbil_provider }})
    runs-on: ${{ matrix.runner }}
    # Source provisioning uses the existing release-build allowance; consumer
    # test watchdogs and performance admission gates are unchanged.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            gerbil_provider: source-host
            gerbil_version_label: v0.19-1cfb032
          - runner: macos-26
            gerbil_provider: source-host
            gerbil_version_label: v0.19-1cfb032

    steps:
      - name: Check out gerbil-bazel
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test source provisioning contracts
        run: python3 tools/ci/test_source_toolchain.py

      - name: Resolve isolated source build directories
        shell: bash
        run: |
          {
            echo "GERBIL_SOURCE_DIRECTORY=$RUNNER_TEMP/gerbil-ci-source"
            echo "GERBIL_PREFIX=$RUNNER_TEMP/gerbil-ci-install"
          } >> "$GITHUB_ENV"

      - name: Install Linux consumer dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            git \
            jq \
            libsqlite3-dev \
            libssl-dev \
            openssl \
            pkg-config \
            sqlite3 \
            zlib1g-dev

      - name: Set up Homebrew
        if: runner.os == 'macOS'
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479

      - name: Install macOS V19 provider dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        shell: bash
        run: |
          set -euo pipefail
          brew install gcc jq openssl@3 pkg-config sqlite zlib
          echo "CC=$(command -v gcc-16)" >> "$GITHUB_ENV"
          echo "CXX=$(command -v g++-16)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Check out exact staging and validate current patches
        id: source
        shell: bash
        run: bash tools/ci/build_source_toolchain.sh prepare

      - name: Restore exact commit source toolchain
        id: source-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.GERBIL_PREFIX }}
          key: gerbil-source-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ steps.source.outputs.cache_identity }}

      - name: Build current patched Gerbil and Gambit sources
        if: steps.source-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash tools/ci/build_source_toolchain.sh build

      - name: Verify and activate the source-built host capability
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/build_source_toolchain.sh verify
          source "$GERBIL_PREFIX/activate"
          echo "$GERBIL_PREFIX/bin" >> "$GITHUB_PATH"
          {
            echo "GERBIL_HOME=$GERBIL_HOME"
            echo "GAMBOPT=$GAMBOPT"
            echo "GERBIL_EXPECTED_VERSION_PREFIX=Gerbil ${GERBIL_SOURCE_REVISION:0:7}"
          } >> "$GITHUB_ENV"

      - name: Test Darwin command substitution contracts
        run: python3 patches/gerbil-v19-darwin/tests/test_gambuild_literal_substitution.py

      - name: Test multi-VM global growth and GC
        run: gxi tools/ci/multiple_vm_globals.ss

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: gerbil-bazel-${{ runner.os }}-${{ runner.arch }}-${{ matrix.gerbil_version_label }}

      - name: Validate the prebuilt repository provider
        run: |
          tools/ci/test_repository_provider.sh prebuilt
          GERBIL_EXPECT_INSTALL_DIGEST_MISMATCH=1 \
            GERBIL_PREBUILT_INSTALL_DIGEST_OVERRIDE="$(printf '0%.0s' {1..64})" \
            tools/ci/test_repository_provider.sh prebuilt

      - name: Validate the platform-adaptive repository provider
        run: tools/ci/test_repository_provider.sh auto

      - name: Validate fail-closed source package repositories
        run: tools/ci/test_source_package_repository.sh

      - name: Validate the public Bazel API
        env:
          RECEIPT_PATH: .ci/receipts/${{ runner.os }}-${{ runner.arch }}.json
        run: tools/ci/validate.sh

      - name: Validate build scenario frontiers
        run: |
          receipt=.ci/receipts/build-scenarios-${{ runner.os }}-${{ runner.arch }}.json
          tools/bench/run_build_scenarios.py --receipt "$receipt"
          jq -e '
            .schema == "gerbil-bazel.build-scenario-receipt.v1" and
            .status == "passed" and
            .decision.status == "ready"
          ' "$receipt" >/dev/null
          jq -e '."$id" | endswith("gerbil-bazel.build-scenario-receipt.v1.schema.json")' \
            schemas/gerbil-bazel.build-scenario-receipt.v1.schema.json >/dev/null

      - name: Upload validation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gerbil-bazel-${{ runner.os }}-${{ runner.arch }}-receipt
          path: |
            .ci/gerbil-version.txt
            .ci/receipts/*.json
          if-no-files-found: warn

  lock-linux-seed:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_lock }}
    name: Lock refresh (linux-amd64 seed)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out gerbil-bazel
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Generate the Linux module-extension evaluation
        run: |
          bazelisk mod deps --config=lock_update
          bazelisk mod deps --lockfile_mode=error

      - name: Upload the Linux lock seed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gerbil-bazel-module-lock-linux-${{ github.run_id }}
          path: MODULE.bazel.lock
          if-no-files-found: error

  lock-darwin-merge:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_lock }}
    name: Lock refresh (darwin-arm64 merge)
    needs: lock-linux-seed
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Check out gerbil-bazel
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download the Linux lock seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gerbil-bazel-module-lock-linux-${{ github.run_id }}
          path: .ci/lock-linux

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Merge the Darwin module-extension evaluation
        run: |
          cp .ci/lock-linux/MODULE.bazel.lock MODULE.bazel.lock
          bazelisk mod deps --config=lock_update
          bazelisk mod deps --lockfile_mode=error

      - name: Upload the merged cross-platform lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gerbil-bazel-module-lock-${{ github.run_id }}
          path: MODULE.bazel.lock
          if-no-files-found: error

  lock-linux-verify:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_lock }}
    name: Lock verify (linux-amd64 merged)
    needs: lock-darwin-merge
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out gerbil-bazel
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download the merged cross-platform lock
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gerbil-bazel-module-lock-${{ github.run_id }}
          path: .ci/lock-merged

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Verify the merged lock on Linux
        run: |
          cp .ci/lock-merged/MODULE.bazel.lock MODULE.bazel.lock
          bazelisk mod deps --lockfile_mode=error
