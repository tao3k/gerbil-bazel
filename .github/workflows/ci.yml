name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_lock:
        description: Generate and verify the cross-platform Bazel module lock
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GERBIL_BUILD_CORES: 2

jobs:
  bazel:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.refresh_lock }}
    name: Bazel (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            release_tag: gerbil-v0.19-2591dcd9b7c6d2c4e9dd8611a17c5b1a5d82bbdb-linux-x86_64-portable-full-single-host-unlimited-patche35312b4a951
            release_sha256: 88d08d3d10e297164191a9b31ee309d215a01727877c9e1c19b0d7dc737a5744
            release_root: gerbil-v0.19-linux-x86_64
          - runner: macos-26
            release_tag: gerbil-v0.19-2591dcd9b7c6d2c4e9dd8611a17c5b1a5d82bbdb-darwin-aarch64-gcc16-arm64-single-host-unlimited-patche35312b4a951
            release_sha256: c53d62f26ff382f8956576963edc3eb9193098dc48de78d44b8a3df63636bd18
            release_root: gerbil-v0.19-darwin-aarch64

    steps:
      - name: Check out gerbil-bazel
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate the pinned merged v0.19 staging revision
        shell: bash
        run: |
          set -euo pipefail
          upstream_dir="$RUNNER_TEMP/gerbil-v19-patch-check"
          staging_sha=2591dcd9b7c6d2c4e9dd8611a17c5b1a5d82bbdb
          git init "$upstream_dir"
          git -C "$upstream_dir" remote add origin https://git.cons.io/mighty-gerbils/gerbil.git
          git -C "$upstream_dir" fetch --depth=256 origin "$staging_sha"
          [[ "$(git -C "$upstream_dir" rev-parse FETCH_HEAD)" == "$staging_sha" ]]
          git -C "$upstream_dir" checkout --detach "$staging_sha"
          git -C "$upstream_dir" apply --check \
            "$GITHUB_WORKSPACE/patches/gerbil-v19-bio-integer-growth-upstream.patch" \
            "$GITHUB_WORKSPACE/patches/gerbil-v19-darwin/0010-gerbil-darwin-socket-address-contract.patch" \
            "$GITHUB_WORKSPACE/patches/gerbil-v19-darwin/0011-gerbil-darwin-release-dynamic-linkage.patch"

      - name: Install Linux consumer dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            git \
            jq \
            libsqlite3-dev \
            libssl-dev \
            openssl \
            pkg-config \
            sqlite3 \
            zlib1g-dev

      - name: Install macOS consumer dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install gcc jq openssl@3 pkg-config sqlite zlib

      - name: Activate the exact published compiler archive
        shell: bash
        env:
          RELEASE_TAG: ${{ matrix.release_tag }}
          RELEASE_SHA256: ${{ matrix.release_sha256 }}
          RELEASE_ROOT: ${{ matrix.release_root }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$RELEASE_TAG.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/tao3k/gerbil-bazel/releases/download/$RELEASE_TAG/$RELEASE_TAG.tar.gz"
          printf '%s  %s\n' "$RELEASE_SHA256" "$archive" | shasum -a 256 --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          source "$RUNNER_TEMP/$RELEASE_ROOT/activate"
          gxi -v
          echo "$GERBIL_PREFIX/bin" >> "$GITHUB_PATH"
          {
            echo "GERBIL_PREFIX=$GERBIL_PREFIX"
            echo "GERBIL_HOME=$GERBIL_HOME"
            echo "GAMBOPT=$GAMBOPT"
          } >> "$GITHUB_ENV"
          bash tools/ci/check_tool_entries.sh

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: gerbil-bazel-${{ runner.os }}-${{ runner.arch }}-${{ matrix.release_sha256 }}

      - name: Validate the prebuilt repository provider
        run: |
          tools/ci/test_repository_provider.sh prebuilt
          GERBIL_EXPECT_INSTALL_DIGEST_MISMATCH=1 \
            GERBIL_PREBUILT_INSTALL_DIGEST_OVERRIDE="$(printf '0%.0s' {1..64})" \
            tools/ci/test_repository_provider.sh prebuilt

      - name: Validate the platform-adaptive repository provider
        run: tools/ci/test_repository_provider.sh auto

      - name: Validate fail-closed source package repositories
        run: tools/ci/test_source_package_repository.sh

      - name: Validate the public Bazel API
        env:
          RECEIPT_PATH: .ci/receipts/${{ runner.os }}-${{ runner.arch }}.json
        run: tools/ci/validate.sh

      - name: Validate build scenario frontiers
        run: |
          receipt=.ci/receipts/build-scenarios-${{ runner.os }}-${{ runner.arch }}.json
          tools/bench/run_build_scenarios.py --receipt "$receipt"
          jq -e '
            .schema == "gerbil-bazel.build-scenario-receipt.v1" and
            .status == "passed" and
            .decision.status == "ready"
          ' "$receipt" >/dev/null
          jq -e '."$id" | endswith("gerbil-bazel.build-scenario-receipt.v1.schema.json")' \
            schemas/gerbil-bazel.build-scenario-receipt.v1.schema.json >/dev/null

      - name: Upload validation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gerbil-bazel-${{ runner.os }}-${{ runner.arch }}-receipt
          path: |
            .ci/gerbil-version.txt
            .ci/receipts/*.json
          if-no-files-found: warn

      - name: Validate V19 Darwin release provider
        if: runner.os == 'macOS'
        working-directory: tests/v19-release
        run: bazelisk --batch build //:smoke

  lock-linux-seed:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_lock }}
    name: Lock refresh (linux-amd64 seed)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out gerbil-bazel
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Generate the Linux module-extension evaluation
        run: |
          bazelisk mod deps --config=lock_update
          bazelisk mod deps --lockfile_mode=error

      - name: Upload the Linux lock seed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gerbil-bazel-module-lock-linux-${{ github.run_id }}
          path: MODULE.bazel.lock
          if-no-files-found: error

  lock-darwin-merge:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_lock }}
    name: Lock refresh (darwin-arm64 merge)
    needs: lock-linux-seed
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Check out gerbil-bazel
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download the Linux lock seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gerbil-bazel-module-lock-linux-${{ github.run_id }}
          path: .ci/lock-linux

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Merge the Darwin module-extension evaluation
        run: |
          cp .ci/lock-linux/MODULE.bazel.lock MODULE.bazel.lock
          bazelisk mod deps --config=lock_update
          bazelisk mod deps --lockfile_mode=error

      - name: Upload the merged cross-platform lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gerbil-bazel-module-lock-${{ github.run_id }}
          path: MODULE.bazel.lock
          if-no-files-found: error

  lock-linux-verify:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_lock }}
    name: Lock verify (linux-amd64 merged)
    needs: lock-darwin-merge
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out gerbil-bazel
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download the merged cross-platform lock
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gerbil-bazel-module-lock-${{ github.run_id }}
          path: .ci/lock-merged

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Verify the merged lock on Linux
        run: |
          cp .ci/lock-merged/MODULE.bazel.lock MODULE.bazel.lock
          bazelisk mod deps --lockfile_mode=error
