name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_lock:
        description: Generate and verify the cross-platform Bazel module lock
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GERBIL_FORMULA_REF: refs/heads/v0.19
  GERBIL_FORMULA_REVISION: 20e7bc74a780e04a78798d21516a924249483895

jobs:
  bazel:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.refresh_lock }}
    name: Bazel (${{ matrix.runner }}, ${{ matrix.gerbil_provider }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            gerbil_provider: released-host
            gerbil_version_label: v0.19-f0badc7
          - runner: macos-26
            gerbil_provider: homebrew-host
            gerbil_version_label: v0.19-f0badc7

    steps:
      - name: Check out gerbil-bazel
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate pinned v0.19 buffered writer patch
        shell: bash
        run: |
          set -euo pipefail
          upstream_dir="$RUNNER_TEMP/gerbil-v19-patch-check"
          git init "$upstream_dir"
          git -C "$upstream_dir" remote add origin https://git.cons.io/mighty-gerbils/gerbil.git
          git -C "$upstream_dir" fetch --depth=1 origin d801e7a1c7f77df421f638e62aaebe370f193c97
          git -C "$upstream_dir" checkout --detach FETCH_HEAD
          git -C "$upstream_dir" apply --check "$GITHUB_WORKSPACE/patches/gerbil-v19-bio-memory-writer.patch"

      - name: Install Linux consumer dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            git \
            jq \
            libsqlite3-dev \
            libssl-dev \
            openssl \
            pkg-config \
            sqlite3 \
            zlib1g-dev

      - name: Install pinned v0.19 Linux release
        if: matrix.gerbil_provider == 'released-host'
        shell: bash
        run: |
          set -euo pipefail
          release=gerbil-v0.19-f0badc77836ef6f4b83d8d222a4a159f71b9c592-linux-x86_64-portable-full-single-host-unlimited
          archive="$RUNNER_TEMP/$release.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/tao3k/gerbil-bazel/releases/download/$release/$release.tar.gz"
          printf '%s  %s\n' \
            df9cae2dd3f6b9f37fdfcf31ff1e2968cf2bb56c9fddb4bfd085bccd0d42a25b \
            "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          source "$RUNNER_TEMP/gerbil-v0.19-linux-x86_64/activate"
          printf 'Activated Gerbil release at %s\n' "$GERBIL_PREFIX"
          ls -l "$GERBIL_PREFIX/bin/gxi"
          echo "$GERBIL_PREFIX/bin" >> "$GITHUB_PATH"
          {
            echo "GERBIL_PREFIX=$GERBIL_PREFIX"
            echo "GERBIL_HOME=$GERBIL_HOME"
            echo "GAMBOPT=$GAMBOPT"
          } >> "$GITHUB_ENV"
          gxi -v 2>&1 | tee /dev/stderr | grep -F 'Gerbil f0badc7'

      - name: Set up Homebrew
        if: matrix.gerbil_provider == 'homebrew-host'
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479

      - name: Install the tao3k Gerbil bottle
        if: matrix.gerbil_provider == 'homebrew-host'
        timeout-minutes: 2
        env:
          GERBIL_FORMULA: tao3k/gerbil/gerbil-scheme@0.19
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_BOTTLE_SOURCE_FALLBACK: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew tap tao3k/gerbil
          tap_repository="$(brew --repository tao3k/gerbil)"
          git -C "$tap_repository" fetch --depth=1 origin "$GERBIL_FORMULA_REF"
          [[ "$(git -C "$tap_repository" rev-parse FETCH_HEAD)" == "$GERBIL_FORMULA_REVISION" ]]
          git -C "$tap_repository" checkout --detach "$GERBIL_FORMULA_REVISION"
          brew install "$GERBIL_FORMULA"
          brew test "$GERBIL_FORMULA"
          "$(brew --prefix "$GERBIL_FORMULA")/bin/gxi" -v 2>&1 \
            | grep -F f0badc7

      - name: Activate the Homebrew host capability
        if: matrix.gerbil_provider == 'homebrew-host'
        env:
          GERBIL_FORMULA: tao3k/gerbil/gerbil-scheme@0.19
        run: |
          gerbil_prefix="$(brew --prefix "$GERBIL_FORMULA")"
          echo "$gerbil_prefix/bin" >> "$GITHUB_PATH"
          echo "GERBIL_PREFIX=$gerbil_prefix" >> "$GITHUB_ENV"

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: gerbil-bazel-${{ runner.os }}-${{ runner.arch }}-${{ matrix.gerbil_version_label }}

      - name: Validate the prebuilt repository provider
        run: |
          tools/ci/test_repository_provider.sh prebuilt
          GERBIL_EXPECT_INSTALL_DIGEST_MISMATCH=1 \
            GERBIL_PREBUILT_INSTALL_DIGEST_OVERRIDE="$(printf '0%.0s' {1..64})" \
            tools/ci/test_repository_provider.sh prebuilt

      - name: Validate the platform-adaptive repository provider
        run: tools/ci/test_repository_provider.sh auto

      - name: Validate fail-closed source package repositories
        run: tools/ci/test_source_package_repository.sh

      - name: Validate the public Bazel API
        env:
          RECEIPT_PATH: .ci/receipts/${{ runner.os }}-${{ runner.arch }}.json
        run: tools/ci/validate.sh

      - name: Validate build scenario frontiers
        run: |
          receipt=.ci/receipts/build-scenarios-${{ runner.os }}-${{ runner.arch }}.json
          tools/bench/run_build_scenarios.py --receipt "$receipt"
          jq -e '
            .schema == "gerbil-bazel.build-scenario-receipt.v1" and
            .status == "passed" and
            .decision.status == "ready"
          ' "$receipt" >/dev/null
          jq -e '."$id" | endswith("gerbil-bazel.build-scenario-receipt.v1.schema.json")' \
            schemas/gerbil-bazel.build-scenario-receipt.v1.schema.json >/dev/null

      - name: Upload validation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gerbil-bazel-${{ runner.os }}-${{ runner.arch }}-receipt
          path: |
            .ci/gerbil-version.txt
            .ci/receipts/*.json
          if-no-files-found: warn

  lock-linux-seed:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_lock }}
    name: Lock refresh (linux-amd64 seed)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out gerbil-bazel
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Generate the Linux module-extension evaluation
        run: |
          bazelisk mod deps --config=lock_update
          bazelisk mod deps --lockfile_mode=error

      - name: Upload the Linux lock seed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gerbil-bazel-module-lock-linux-${{ github.run_id }}
          path: MODULE.bazel.lock
          if-no-files-found: error

  lock-darwin-merge:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_lock }}
    name: Lock refresh (darwin-arm64 merge)
    needs: lock-linux-seed
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Check out gerbil-bazel
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download the Linux lock seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gerbil-bazel-module-lock-linux-${{ github.run_id }}
          path: .ci/lock-linux

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Merge the Darwin module-extension evaluation
        run: |
          cp .ci/lock-linux/MODULE.bazel.lock MODULE.bazel.lock
          bazelisk mod deps --config=lock_update
          bazelisk mod deps --lockfile_mode=error

      - name: Upload the merged cross-platform lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gerbil-bazel-module-lock-${{ github.run_id }}
          path: MODULE.bazel.lock
          if-no-files-found: error

  lock-linux-verify:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_lock }}
    name: Lock verify (linux-amd64 merged)
    needs: lock-darwin-merge
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out gerbil-bazel
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download the merged cross-platform lock
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gerbil-bazel-module-lock-${{ github.run_id }}
          path: .ci/lock-merged

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Verify the merged lock on Linux
        run: |
          cp .ci/lock-merged/MODULE.bazel.lock MODULE.bazel.lock
          bazelisk mod deps --lockfile_mode=error
