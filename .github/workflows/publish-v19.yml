name: Publish Gerbil v0.19 capability

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Exact Gerbil v0.19 revision or ref
        default: 94b87422fb6dd055f9667d86527254bd1ebaf4bb
        required: true
        type: string
      platform:
        description: Platform capability to publish
        default: linux-x86_64
        required: true
        type: choice
        options:
          - linux-x86_64
          - darwin-aarch64

permissions:
  contents: write

concurrency:
  group: gerbil-v19-${{ inputs.platform }}-${{ inputs.upstream_ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish (${{ inputs.platform }})
    runs-on: ${{ inputs.platform == 'linux-x86_64' && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 180
    steps:
      - name: Check out gerbil-bazel
        uses: actions/checkout@v7

      - name: Resolve exact upstream revision
        id: upstream
        env:
          TARGET_PLATFORM: ${{ inputs.platform }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git init upstream-gerbil
          git -C upstream-gerbil remote add origin https://git.cons.io/mighty-gerbils/gerbil.git
          git -C upstream-gerbil fetch --depth=1 origin "$UPSTREAM_REF"
          upstream_sha="$(git -C upstream-gerbil rev-parse FETCH_HEAD)"
          case "$TARGET_PLATFORM" in
            linux-x86_64)
              release_os=linux
              release_arch=x86_64
              build_profile=portable
              ;;
            darwin-aarch64)
              release_os=darwin
              release_arch=aarch64
              build_profile=gcc16-native-smp
              ;;
            *)
              echo "unsupported release platform: $TARGET_PLATFORM" >&2
              exit 64
              ;;
          esac
          release_tag="gerbil-v0.19-$upstream_sha-$TARGET_PLATFORM-$build_profile"
          archive="$release_tag.tar.gz"
          {
            echo "sha=$upstream_sha"
            echo "os=$release_os"
            echo "arch=$release_arch"
            echo "release_tag=$release_tag"
            echo "archive=$archive"
          } >> "$GITHUB_OUTPUT"
          {
            echo "GERBIL_PREFIX=$RUNNER_TEMP/gerbil-v19"
            echo "RELEASE_TAG=$release_tag"
            echo "RELEASE_ARCHIVE=$archive"
            echo "GERBIL_BUILD_PROFILE=$build_profile"
          } >> "$GITHUB_ENV"

      - name: Restore exact release toolchain
        id: gerbil-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.GERBIL_PREFIX }}
          key: gerbil-release-v0.19-full-v3-${{ inputs.platform }}-${{ env.GERBIL_BUILD_PROFILE }}-${{ steps.upstream.outputs.sha }}

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            coreutils \
            git \
            jq \
            libsqlite3-dev \
            libssl-dev \
            openssl \
            pkg-config \
            sqlite3 \
            zlib1g-dev

      - name: Install Darwin native dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dependencies=(coreutils pkg-config openssl@3 sqlite zlib)
          if [[ "$GERBIL_BUILD_PROFILE" == gcc16-native-* ]]; then
            dependencies+=(gcc)
          fi
          brew install "${dependencies[@]}"

      - name: Resolve native build capacity
        if: steps.gerbil-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == macOS ]]; then
            cores="$(sysctl -n hw.logicalcpu)"
          else
            cores="$(getconf _NPROCESSORS_ONLN)"
          fi
          [[ "$cores" =~ ^[1-9][0-9]*$ ]]
          echo "GERBIL_BUILD_CORES=$cores" >> "$GITHUB_ENV"

      - name: Materialize v0.19 sources
        if: steps.gerbil-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream-gerbil checkout --detach FETCH_HEAD
          git -C upstream-gerbil submodule update --init --depth=1

      - name: Build exact v0.19 toolchain
        if: steps.gerbil-cache.outputs.cache-hit != 'true'
        working-directory: upstream-gerbil
        shell: bash
        run: |
          set -euo pipefail
          default_runtime_options=platform-default
          bootstrap_runtime_options=p1
          gambit_bootstrap_cores=1
          gambit_bootstrap_profile=platform-default
          gambit_vm_profile=platform-default
          if [[ "$GERBIL_BUILD_PROFILE" == gcc16-native-* ]]; then
            default_runtime_options=p100%,tE8,f8,-8
            gambit_bootstrap_profile=smp-single-threaded-host
            gambit_vm_profile=smp-multi-threaded-vm
            export PATH="$(brew --prefix)/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
            cc="$(command -v gcc-16)"
            cxx="$(command -v g++-16)"
            export CC="$cc" CXX="$cxx" GERBIL_GCC="$cc"
            link_probe="$RUNNER_TEMP/gerbil-gcc-link-probe"
            printf '%s\n' \
              '#include <stdio.h>' \
              'int main(void) { FILE *f = fopen("gerbil-gcc-link-probe.out", "w"); return ferror(f) || fclose(f); }' \
              > "$link_probe.c"
            "$cc" -march=native "$link_probe.c" -o "$link_probe"
            "$link_probe"
            linker="$(xcrun --find ld) $(xcrun ld -v 2>&1)"
            host_configure_args=(
              "--prefix=$GERBIL_PREFIX"
              --enable-march=native
              --enable-smp
              --enable-single-host=0
              --enable-optimized-module-limit=0
              --enable-c-opt=-O1
              --enable-c-opt-rts=yes
              --enable-gcc-opts
              --enable-inline-jumps
              --enable-dynamic-clib
              --enable-trust-c-tco
              "--enable-default-runtime-options=$bootstrap_runtime_options,tE8,f8,-8"
            )
            configure_args=(
              "--prefix=$GERBIL_PREFIX"
              --enable-march=native
              --enable-smp
              --enable-multiple-threaded-vms
              --enable-single-host=0
              --enable-optimized-module-limit=0
              --enable-c-opt=-O1
              --enable-c-opt-rts=yes
              --enable-gcc-opts
              --enable-inline-jumps
              --enable-dynamic-clib
              --enable-trust-c-tco
              "--enable-default-runtime-options=$default_runtime_options"
            )
          else
            cc="${CC:-$(command -v cc)}"
            cxx="${CXX:-$(command -v c++)}"
            linker="$(command -v ld) $(ld --version 2>&1)"
            configure_args=("--prefix=$GERBIL_PREFIX")
            host_configure_args=("${configure_args[@]}")
          fi
          ./configure "${host_configure_args[@]}"
          # Keep the release closure aligned with Gerbil's official full build.
          # libgerbil materializes the static runtime/compiler/stdlib objects
          # consumed by native Gerbil executables; stopping at stdlib leaves an
          # interpreter-only installation and hides an expensive first-load
          # path until downstream use.
          build_stages=(prepare gambit)
          for target in prepare gambit; do
            target_cores="$GERBIL_BUILD_CORES"
            if [[ "$target" == gambit ]]; then
              target_cores="$gambit_bootstrap_cores"
            fi
            target_started_at="$SECONDS"
            echo "[gerbil-v19] phase=$target state=start cores=$target_cores profile=$gambit_bootstrap_profile"
            GERBIL_BUILD_FLAGS="-j$target_cores" \
              ./build.sh "$target"
            if [[ "$target" == gambit ]]; then
              for bootstrap_tool in build/bin/gsi build/bin/gsc; do
                if [[ ! -x "$bootstrap_tool" ]]; then
                  echo "[gerbil-v19] phase=gambit state=failed missingExecutable=$bootstrap_tool" >&2
                  exit 1
                fi
              done
            fi
            echo "[gerbil-v19] phase=$target state=complete elapsedSeconds=$((SECONDS - target_started_at))"
          done
          if [[ "$GERBIL_BUILD_PROFILE" == gcc16-native-* ]]; then
            host_gsc_boot="$RUNNER_TEMP/gerbil-v19-host-gsc-boot"
            cp src/gambit/gsc-boot "$host_gsc_boot"
            target_prefix="$(pwd -P)/build"
            target_started_at="$SECONDS"
            echo "[gerbil-v19] phase=gambit-target state=start cores=$gambit_bootstrap_cores profile=$gambit_vm_profile"
            (
              cd src/gambit
              CFLAGS=-foptimize-sibling-calls LDFLAGS= ./configure \
                "--prefix=$target_prefix" \
                --enable-march=native \
                --disable-shared \
                --enable-targets= \
                --enable-smp \
                --enable-multiple-threaded-vms \
                --enable-single-host=0 \
                --enable-optimized-module-limit=0 \
                --enable-c-opt=-O1 \
                --enable-c-opt-rts=yes \
                --enable-gcc-opts \
                --enable-inline-jumps \
                --enable-dynamic-clib \
                --enable-trust-c-tco \
                "--enable-default-runtime-options=$default_runtime_options" \
                "CC=$cc" "CXX=$cxx"
            )
            make -C src/gambit clean
            cp "$host_gsc_boot" src/gambit/gsc-boot
            make -C src/gambit -j"$gambit_bootstrap_cores" core
            make -C src/gambit -j"$gambit_bootstrap_cores" install
            for target_tool in build/bin/gsi build/bin/gsc; do
              test -x "$target_tool"
            done
            grep -Fx '#define ___MULTIPLE_THREADED_VMS' build/include/gambit.h
            ! grep -Fq '#define ___SINGLE_THREADED_VMS' build/include/gambit.h
            echo "[gerbil-v19] phase=gambit-target state=complete elapsedSeconds=$((SECONDS - target_started_at))"
            build_stages+=(gambit-target)
          fi
          for target in boot-gxi stage0 stage1 stdlib libgerbil; do
            target_started_at="$SECONDS"
            echo "[gerbil-v19] phase=$target state=start cores=$GERBIL_BUILD_CORES"
            GERBIL_BUILD_FLAGS="-j$GERBIL_BUILD_CORES" ./build.sh "$target"
            echo "[gerbil-v19] phase=$target state=complete elapsedSeconds=$((SECONDS - target_started_at))"
            build_stages+=("$target")
          done
          ./install.sh
          jq -n \
            --arg schema gerbil-bazel.build-receipt.v1 \
            --arg profile "$GERBIL_BUILD_PROFILE" \
            --arg compiler "$cc $("$cc" -dumpfullversion)" \
            --arg cxxCompiler "$cxx $("$cxx" -dumpfullversion)" \
            --arg linker "$linker" \
            --arg defaultRuntimeOptions "$default_runtime_options" \
            --arg bootstrapRuntimeOptions "$bootstrap_runtime_options" \
            --arg gambitBootstrapProfile "$gambit_bootstrap_profile" \
            --arg gambitVmProfile "$gambit_vm_profile" \
            --argjson hostConfigureArguments "$(printf '%s\n' "${host_configure_args[@]}" | jq -Rsc 'split("\n")[:-1]')" \
            --argjson buildStages "$(printf '%s\n' "${build_stages[@]}" | jq -Rsc 'split("\n")[:-1]')" \
            --argjson gerbilBuildCores "$GERBIL_BUILD_CORES" \
            --argjson gambitBootstrapCores "$gambit_bootstrap_cores" \
            '{schema: $schema, profile: $profile, compiler: $compiler,
              cxxCompiler: $cxxCompiler, linker: $linker,
              cores: $gerbilBuildCores, gerbilBuildCores: $gerbilBuildCores,
              gambitBootstrapCores: $gambitBootstrapCores,
              gambitBootstrapProfile: $gambitBootstrapProfile,
              gambitVmProfile: $gambitVmProfile,
              hostConfigureArguments: $hostConfigureArguments,
              buildStages: $buildStages,
              bootstrapRuntimeOptions: $bootstrapRuntimeOptions,
              defaultRuntimeOptions: $defaultRuntimeOptions,
              configureArguments: $ARGS.positional}' \
            --args -- "${configure_args[@]}" \
            > "$GERBIL_PREFIX/gerbil-build-receipt.json"

      - name: Save exact release toolchain
        if: steps.gerbil-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.GERBIL_PREFIX }}
          key: gerbil-release-v0.19-full-v3-${{ inputs.platform }}-${{ env.GERBIL_BUILD_PROFILE }}-${{ steps.upstream.outputs.sha }}

      - name: Verify source toolchain
        shell: bash
        run: |
          set -euo pipefail
          cp tools/release/activate-gerbil.sh "$GERBIL_PREFIX/activate"
          chmod +x "$GERBIL_PREFIX/activate"
          source "$GERBIL_PREFIX/activate"
          timeout_command="$(command -v gtimeout || command -v timeout)"
          date_command="$(command -v gdate || command -v date)"
          expected_sha="${{ steps.upstream.outputs.sha }}"
          [[ "$(gxi -v)" == *"${expected_sha:0:7}"* ]]
          jq -e \
            --arg profile "$GERBIL_BUILD_PROFILE" \
            '.schema == "gerbil-bazel.build-receipt.v1" and
             .profile == $profile and
             .bootstrapRuntimeOptions == "p1" and
             (.configureArguments | type == "array")' \
            "$GERBIL_PREFIX/gerbil-build-receipt.json"
          if [[ "$GERBIL_BUILD_PROFILE" == gcc16-native-* ]]; then
            jq -e \
              '(["--enable-smp",
                 "--enable-multiple-threaded-vms",
                 "--enable-gcc-opts",
                 "--enable-default-runtime-options=p100%,tE8,f8,-8"] - .configureArguments | length == 0) and
               (["--enable-smp",
                 "--enable-gcc-opts",
                 "--enable-default-runtime-options=p1,tE8,f8,-8"] - .hostConfigureArguments | length == 0) and
               (.hostConfigureArguments | index("--enable-multiple-threaded-vms") | not) and
               (["prepare", "gambit", "gambit-target", "boot-gxi", "stage0", "stage1", "stdlib", "libgerbil"] - .buildStages | length == 0)' \
              "$GERBIL_PREFIX/gerbil-build-receipt.json"
            grep -Fx '#define ___MULTIPLE_THREADED_VMS' "$GERBIL_PREFIX/include/gambit.h"
            ! grep -Fq '#define ___SINGLE_THREADED_VMS' "$GERBIL_PREFIX/include/gambit.h"
            [[ "$(gsc -e '(cond-expand (enable-smp (display "enabled")) (else (display "disabled")))')" == enabled ]]
            cpu_count="$(gxi -e '(write (##cpu-count))')"
            processor_count="$(gxi -e '(write (##current-vm-processor-count))')"
            echo "[gerbil-v19] phase=source-runtime cpuCount=$cpu_count processorCount=$processor_count expectedProcessorCount=$cpu_count"
            (( cpu_count > 1 ))
            (( processor_count == cpu_count ))
          fi
          gsc -v
          for attempt in 1 2 3 4 5; do
            attempt_started_ms="$($date_command +%s%3N)"
            echo "[gerbil-v19] phase=source-import attempt=$attempt state=start budgetMs=2000"
            "$timeout_command" 2 \
              gxi -e '(begin (import :std/make) (displayln "std/make import ready"))'
            echo "[gerbil-v19] phase=source-import attempt=$attempt state=complete elapsedMs=$(($($date_command +%s%3N) - attempt_started_ms))"
          done

      - name: Package relocatable capability
        shell: bash
        run: |
          set -euo pipefail
          release_root="$RUNNER_TEMP/release"
          capability_name="gerbil-v0.19-${{ inputs.platform }}"
          capability="$release_root/$capability_name"
          mkdir -p "$capability"
          cp -a "$GERBIL_PREFIX/." "$capability/"
          version="$(
            source "$capability/activate"
            gxi -v
          )"
          jq -n \
            --arg schema gerbil-bazel.toolchain-release.v1 \
            --arg version "$version" \
            --arg upstreamRevision "${{ steps.upstream.outputs.sha }}" \
            --arg os "${{ steps.upstream.outputs.os }}" \
            --arg arch "${{ steps.upstream.outputs.arch }}" \
            --arg buildProfile "$GERBIL_BUILD_PROFILE" \
            '{schema: $schema, version: $version,
              upstreamRevision: $upstreamRevision,
              platform: {os: $os, arch: $arch},
              buildProfile: $buildProfile,
              activation: "source ./activate"}' \
            > "$capability/gerbil-toolchain-release.json"
          tar -czf "$release_root/$RELEASE_ARCHIVE" -C "$release_root" "$capability_name"
          (
            cd "$release_root"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$RELEASE_ARCHIVE" > "$RELEASE_ARCHIVE.sha256"
            else
              shasum -a 256 "$RELEASE_ARCHIVE" > "$RELEASE_ARCHIVE.sha256"
            fi
          )

      - name: Verify relocated release bytes
        shell: bash
        run: |
          set -euo pipefail
          verify_root="$RUNNER_TEMP/relocated-release"
          mkdir -p "$verify_root"
          tar -xzf "$RUNNER_TEMP/release/$RELEASE_ARCHIVE" -C "$verify_root"
          source "$verify_root/gerbil-v0.19-${{ inputs.platform }}/activate"
          timeout_command="$(command -v gtimeout || command -v timeout)"
          date_command="$(command -v gdate || command -v date)"
          expected_sha="${{ steps.upstream.outputs.sha }}"
          [[ "$(gxi -v)" == *"${expected_sha:0:7}"* ]]
          jq -e \
            --arg profile "$GERBIL_BUILD_PROFILE" \
            '.profile == $profile and
             .bootstrapRuntimeOptions == "p1"' \
            "$verify_root/gerbil-v0.19-${{ inputs.platform }}/gerbil-build-receipt.json"
          if [[ "$GERBIL_BUILD_PROFILE" == gcc16-native-* ]]; then
            grep -Fx '#define ___MULTIPLE_THREADED_VMS' \
              "$verify_root/gerbil-v0.19-${{ inputs.platform }}/include/gambit.h"
            ! grep -Fq '#define ___SINGLE_THREADED_VMS' \
              "$verify_root/gerbil-v0.19-${{ inputs.platform }}/include/gambit.h"
            [[ "$(gsc -e '(cond-expand (enable-smp (display "enabled")) (else (display "disabled")))')" == enabled ]]
            cpu_count="$(gxi -e '(write (##cpu-count))')"
            processor_count="$(gxi -e '(write (##current-vm-processor-count))')"
            echo "[gerbil-v19] phase=relocated-runtime cpuCount=$cpu_count processorCount=$processor_count expectedProcessorCount=$cpu_count"
            (( cpu_count > 1 ))
            (( processor_count == cpu_count ))
          fi
          gsc -v
          for attempt in 1 2 3 4 5; do
            attempt_started_ms="$($date_command +%s%3N)"
            echo "[gerbil-v19] phase=relocated-import attempt=$attempt state=start budgetMs=2000"
            "$timeout_command" 2 \
              gxi -e '(begin (import :std/make) (displayln "relocated std/make ready"))'
            echo "[gerbil-v19] phase=relocated-import attempt=$attempt state=complete elapsedMs=$(($($date_command +%s%3N) - attempt_started_ms))"
          done

      - name: Publish immutable central release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "immutable release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/release/$RELEASE_ARCHIVE" \
            "$RUNNER_TEMP/release/$RELEASE_ARCHIVE.sha256" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TAG" \
            --notes "Central Gerbil v0.19 ${{ inputs.platform }} capability at ${{ steps.upstream.outputs.sha }} using profile $GERBIL_BUILD_PROFILE. Source the bundled activate file after extraction; inspect gerbil-build-receipt.json for the exact compiler and configure arguments."
