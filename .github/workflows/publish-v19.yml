name: Publish Gerbil v0.19 capability

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      platform:
        description: Capability platforms
        default: both
        type: choice
        options: [both, linux-x86_64, darwin-aarch64]
      upstream_ref:
        description: Optional exact revision; must match the shared profile
        default: ""
        type: string
      source_run_id:
        description: Optional successful main CI run to distribute without rebuilding
        default: ""
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: v19-publish-${{ github.event.workflow_run.head_sha || github.sha }}-${{ inputs.platform || 'both' }}
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      commit: ${{ steps.plan.outputs.commit }}
      source_run: ${{ steps.plan.outputs.source_run }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: plan
        env:
          PLATFORM: ${{ inputs.platform || 'both' }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
          SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release/plan_publish.sh

  publish:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: Publish (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential ca-certificates git jq libsqlite3-dev libssl-dev openssl pkg-config sqlite3 zlib1g-dev
      - name: Set up Homebrew
        if: runner.os == 'macOS'
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install gcc jq openssl@3 pkg-config sqlite zlib
          echo "CC=$(command -v gcc-16)" >> "$GITHUB_ENV"
          echo "CXX=$(command -v g++-16)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Download the exact validated CI capability
        if: needs.plan.outputs.source_run != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: v19-source-${{ matrix.os }}
          run-id: ${{ needs.plan.outputs.source_run }}
          github-token: ${{ github.token }}
          path: .ci/release
      - name: Configure isolated manual build directories
        if: needs.plan.outputs.source_run == ''
        run: |
          echo "GERBIL_SOURCE_DIRECTORY=$RUNNER_TEMP/gerbil-ci-source" >> "$GITHUB_ENV"
          echo "GERBIL_PREFIX=$RUNNER_TEMP/gerbil-ci-install" >> "$GITHUB_ENV"
      - name: Prepare the shared source toolchain
        if: needs.plan.outputs.source_run == ''
        id: source
        run: bash tools/ci/build_source_toolchain.sh prepare
      - name: Restore the exact source toolchain
        if: needs.plan.outputs.source_run == ''
        id: source-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.GERBIL_PREFIX }}
          key: gerbil-source-v1-${{ runner.os }}-${{ runner.arch }}-${{ needs.plan.outputs.commit }}-${{ steps.source.outputs.cache_identity }}
      - name: Build through the shared interface
        if: needs.plan.outputs.source_run == '' && steps.source-cache.outputs.cache-hit != 'true'
        run: bash tools/ci/build_source_toolchain.sh build
      - name: Verify and package the shared source capability
        if: needs.plan.outputs.source_run == ''
        run: |
          bash tools/ci/build_source_toolchain.sh verify
          source "$GERBIL_PREFIX/activate"
          gxi tools/ci/multiple_vm_globals.ss
          bash tools/release/package_toolchain.sh
      - name: Publish or verify the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: bash tools/release/publish_toolchain.sh .ci/release
