name: Publish Gerbil v0.19 capability

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Exact Gerbil v0.19 revision or ref
        default: 2591dcd9b7c6d2c4e9dd8611a17c5b1a5d82bbdb
        required: true
        type: string
      platform:
        description: Platform capability to publish
        default: linux-x86_64
        required: true
        type: choice
        options:
          - linux-x86_64
          - darwin-aarch64
permissions:
  contents: write

concurrency:
  group: gerbil-v19-${{ inputs.platform }}-${{ inputs.upstream_ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish (${{ inputs.platform }})
    runs-on: ${{ inputs.platform == 'linux-x86_64' && 'ubuntu-latest' || 'macos-26' }}
    timeout-minutes: 360
    steps:
      - name: Check out gerbil-bazel
        uses: actions/checkout@v7

      - name: Resolve exact upstream revision
        id: upstream
        env:
          TARGET_PLATFORM: ${{ inputs.platform }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git init upstream-gerbil
          git -C upstream-gerbil remote add origin https://git.cons.io/mighty-gerbils/gerbil.git
          git -C upstream-gerbil fetch --depth=256 origin "$UPSTREAM_REF"
          upstream_sha="$(git -C upstream-gerbil rev-parse FETCH_HEAD)"
          git -C upstream-gerbil checkout --detach "$upstream_sha"
          source_sha="$upstream_sha"
          patchset_sha="$({
            for patch in \
              .github/workflows/publish-v19.yml \
              patches/gerbil-v19-bio-integer-growth-upstream.patch \
              patches/gerbil-v19-ffi-release-pkey-once.patch \
              patches/gerbil-v19-darwin-aot-tools.patch \
              patches/gerbil-v19-darwin/0001-gambit-darwin-posix-spawn.patch \
              patches/gerbil-v19-darwin/0002-gerbil-streaming-compile-executor.patch \
              patches/gerbil-v19-darwin/0003-gerbil-darwin-executable-closure-dag.patch \
              patches/gerbil-v19-darwin/0004-gambit-darwin-gcc-macro-expansion.patch \
              patches/gerbil-v19-darwin/0010-gerbil-darwin-socket-address-contract.patch \
              patches/gerbil-v19-darwin/0011-gerbil-darwin-release-dynamic-linkage.patch \
              patches/gerbil-v19-darwin/tests/compiler-executor-contract.ss; do
              printf '%s %s\n' "$patch" "$(git hash-object "$patch")"
            done
          } | git hash-object --stdin)"
          case "$TARGET_PLATFORM" in
            linux-x86_64)
              release_os=linux
              release_arch=x86_64
              build_profile=portable-full-single-host-unlimited
              ;;
            darwin-aarch64)
              release_os=darwin
              release_arch=aarch64
              build_profile=gcc16-arm64-aot-tools-single-host-unlimited
              ;;
            *)
              echo "unsupported release platform: $TARGET_PLATFORM" >&2
              exit 64
              ;;
          esac
          release_tag="gerbil-v0.19-$source_sha-$TARGET_PLATFORM-$build_profile-patch${patchset_sha:0:12}"
          archive="$release_tag.tar.gz"
          {
            echo "sha=$source_sha"
            echo "staging_sha=$upstream_sha"
            echo "ensemble_sha=$upstream_sha"
            echo "patchset_sha=$patchset_sha"
            echo "os=$release_os"
            echo "arch=$release_arch"
            echo "release_tag=$release_tag"
            echo "archive=$archive"
          } >> "$GITHUB_OUTPUT"
          {
            echo "GERBIL_PREFIX=$RUNNER_TEMP/gerbil-v19"
            echo "RELEASE_TAG=$release_tag"
            echo "RELEASE_ARCHIVE=$archive"
            echo "GERBIL_BUILD_PROFILE=$build_profile"
            echo "GERBIL_PATCHSET_SHA=$patchset_sha"
          } >> "$GITHUB_ENV"

      - name: Restore exact release toolchain
        id: gerbil-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.GERBIL_PREFIX }}
          key: gerbil-release-v0.19-full-v4-${{ inputs.platform }}-${{ env.GERBIL_BUILD_PROFILE }}-${{ steps.upstream.outputs.sha }}-${{ steps.upstream.outputs.patchset_sha }}

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            coreutils \
            git \
            jq \
            libsqlite3-dev \
            libssl-dev \
            openssl \
            pkg-config \
            sqlite3 \
            zlib1g-dev

      - name: Install Darwin native dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dependencies=(pkg-config openssl@3 sqlite zlib)
          if [[ "$GERBIL_BUILD_PROFILE" == gcc16-* ]]; then
            dependencies+=(gcc)
          fi
          brew install "${dependencies[@]}"

      - name: Resolve native build capacity
        if: steps.gerbil-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == macOS ]]; then
            cores="$(sysctl -n hw.logicalcpu)"
          else
            cores="$(getconf _NPROCESSORS_ONLN)"
          fi
          [[ "$cores" =~ ^[1-9][0-9]*$ ]]
          echo "GERBIL_BUILD_CORES=$cores" >> "$GITHUB_ENV"

      - name: Materialize v0.19 sources
        if: steps.gerbil-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream-gerbil submodule update --init --depth=1

      - name: Apply the remaining v0.19 buffered integer writer fix
        if: steps.gerbil-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream-gerbil apply "$GITHUB_WORKSPACE/patches/gerbil-v19-bio-integer-growth-upstream.patch"

      - name: Apply audited Darwin whole-program patches
        if: steps.gerbil-cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          git -C upstream-gerbil apply "$GITHUB_WORKSPACE/patches/gerbil-v19-ffi-release-pkey-once.patch"
          git -C upstream-gerbil apply "$GITHUB_WORKSPACE/patches/gerbil-v19-darwin-aot-tools.patch"
          git -C upstream-gerbil apply "$GITHUB_WORKSPACE/patches/gerbil-v19-darwin/0002-gerbil-streaming-compile-executor.patch"
          git -C upstream-gerbil apply "$GITHUB_WORKSPACE/patches/gerbil-v19-darwin/0003-gerbil-darwin-executable-closure-dag.patch"
          git -C upstream-gerbil apply "$GITHUB_WORKSPACE/patches/gerbil-v19-darwin/0010-gerbil-darwin-socket-address-contract.patch"
          git -C upstream-gerbil apply "$GITHUB_WORKSPACE/patches/gerbil-v19-darwin/0011-gerbil-darwin-release-dynamic-linkage.patch"

      - name: Build exact v0.19 toolchain
        if: steps.gerbil-cache.outputs.cache-hit != 'true'
        working-directory: upstream-gerbil
        shell: bash
        env:
          SINGLE_HOST_MODE: unlimited
          GERBIL_BUILD_AOT_TOOLS: ${{ runner.os == 'macOS' && 'yes' || 'no' }}
        run: |
          set -euo pipefail
          if [[ "$GERBIL_BUILD_PROFILE" == gcc16-* ]]; then
            PATH="$(brew --prefix)/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
            export PATH
            cc="$(command -v gcc-16)"
            cxx="$(command -v g++-16)"
            export CC="$cc" CXX="$cxx" GERBIL_GCC="$cc"
            openssl_prefix="$(brew --prefix openssl@3)"
            sqlite_prefix="$(brew --prefix sqlite)"
            zlib_prefix="$(brew --prefix zlib)"
            export PKG_CONFIG_PATH="$openssl_prefix/lib/pkgconfig:$sqlite_prefix/lib/pkgconfig:$zlib_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            export CFLAGS="-pipe${CFLAGS:+ $CFLAGS}"
            link_probe="$RUNNER_TEMP/gerbil-gcc-link-probe"
            printf '%s\n' \
              '#include <stdio.h>' \
              'int main(void) { FILE *f = fopen("gerbil-gcc-link-probe.out", "w"); return ferror(f) || fclose(f); }' \
              > "$link_probe.c"
            "$cc" "$link_probe.c" -o "$link_probe"
            "$link_probe"
            linker="$(xcrun --find ld) $(xcrun ld -v 2>&1)"
            configure_args=(
              "--prefix=$GERBIL_PREFIX"
              --enable-march=
              --enable-smp
              --enable-c-opt=-O1
              --enable-c-opt-rts=yes
              --enable-gcc-opts
              --enable-inline-jumps
              --enable-dynamic-clib
              --enable-trust-c-tco
            )
          else
            cc="${CC:-$(command -v cc)}"
            cxx="${CXX:-$(command -v c++)}"
            linker="$(command -v ld) $(ld --version 2>&1)"
            configure_args=("--prefix=$GERBIL_PREFIX" --enable-march=)
          fi
          configure_args+=(--enable-single-host=0)
          ./configure "${configure_args[@]}"
          if grep -F -- '-march=native' src/gambit/bin/gambuild-C.unix; then
            echo "release build must not use runner-specific -march=native" >&2
            exit 1
          fi
          # Gerbil configure resets the integrated Gambit submodule to the
          # configured revision. Apply Darwin Gambit patches afterwards, then
          # recheck configure so compiler capability flags reach gambuild-C.
          if [[ "${{ runner.os }}" == macOS ]]; then
            git -C src/gambit apply "$GITHUB_WORKSPACE/patches/gerbil-v19-darwin/0001-gambit-darwin-posix-spawn.patch"
            git -C src/gambit apply "$GITHUB_WORKSPACE/patches/gerbil-v19-darwin/0004-gambit-darwin-gcc-macro-expansion.patch"
            # Both generated configure and configure.ac are carried in the
            # audited patch. Keep configure newest so Gambit's make rules do
            # not regenerate it with an arbitrary host Autoconf version.
            touch src/gambit/configure
            # --recheck runs configure with --no-create, so explicitly
            # regenerate the configured templates before checking the flag.
            (cd src/gambit && ./config.status --recheck && ./config.status)
            # The executable gambuild-C is created later by make.
            grep -F -- '-ftrack-macro-expansion=0' src/gambit/bin/gambuild-C.unix
          fi
          gambit_config_header=src/gambit/include/config.h
          gambit_public_header=src/gambit/include/gambit.h
          grep -Eq '^#define ___SINGLE_HOST([[:space:]]|$)' "$gambit_config_header"
          grep -Eq '^#define ___SINGLE_HOST_LIMIT 0$' "$gambit_public_header"
          printf 'mode=%s\n' "$SINGLE_HOST_MODE" \
            > "$RUNNER_TEMP/gerbil-v19-build-timings.txt"
          for target in prepare gambit boot-gxi stage0 stage1 stdlib libgerbil lang tools; do
            target_cores="$GERBIL_BUILD_CORES"
            target_started=$SECONDS
            GERBIL_BUILD_FLAGS="-j$target_cores" ./build.sh "$target"
            target_seconds=$((SECONDS - target_started))
            printf '%s=%s\n' "$target" "$target_seconds" \
              | tee -a "$RUNNER_TEMP/gerbil-v19-build-timings.txt"
            echo "::notice title=Gerbil build timing::$target completed in ${target_seconds}s with ${target_cores} core(s)"
          done
          if [[ "${{ runner.os }}" == macOS ]]; then
            (cd src/gambit/tests && \
              ../gsi/gsi -:=.. run-unit-tests.scm \
                unit-tests/12-os/process_spawn.scm)
          fi
          ./install.sh
          cp "$RUNNER_TEMP/gerbil-v19-build-timings.txt" \
            "$GERBIL_PREFIX/gerbil-build-timings.txt"
          jq -n \
            --arg schema gerbil-bazel.build-receipt.v1 \
            --arg sourceRevision "${{ steps.upstream.outputs.sha }}" \
            --arg stagingRevision "${{ steps.upstream.outputs.staging_sha }}" \
            --arg ensembleRevision "${{ steps.upstream.outputs.ensemble_sha }}" \
            --arg profile "$GERBIL_BUILD_PROFILE" \
            --arg patchsetSha "$GERBIL_PATCHSET_SHA" \
            --arg compiler "$cc $("$cc" -dumpfullversion)" \
            --arg cxxCompiler "$cxx $("$cxx" -dumpfullversion)" \
            --arg linker "$linker" \
            --arg singleHostMode "$SINGLE_HOST_MODE" \
            --arg toolLinkage "$([[ "$GERBIL_BUILD_PROFILE" == *-aot-tools-* ]] && echo whole-program-aot || echo dynamic)" \
            --arg cFlags "${CFLAGS:-}" \
            --arg pkgConfigPath "${PKG_CONFIG_PATH:-}" \
            --argjson cores "$GERBIL_BUILD_CORES" \
            '{schema: $schema,
              sourceRevision: $sourceRevision,
              stagingRevision: $stagingRevision,
              ensembleRevision: $ensembleRevision,
              profile: $profile, patchsetSha: $patchsetSha,
              compiler: $compiler,
              cxxCompiler: $cxxCompiler, linker: $linker, cores: $cores,
              singleHostMode: $singleHostMode,
              toolLinkage: $toolLinkage,
              environment: {
                cFlags: $cFlags,
                pkgConfigPath: $pkgConfigPath
              },
              configureArguments: $ARGS.positional}' \
            --args -- "${configure_args[@]}" \
            > "$GERBIL_PREFIX/gerbil-build-receipt.json"

      - name: Verify focused upstream runtime contracts
        if: steps.gerbil-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/gerbil-v19-focused-tests.log"
          export GERBIL_HOME="$GITHUB_WORKSPACE/upstream-gerbil/build"
          export GERBIL_LOADPATH="$GERBIL_HOME/lib"
          export PATH="$GERBIL_HOME/bin:$PATH"
          gxtest -v 3 \
            upstream-gerbil/src/std/io/bio/bio-test.ss \
            upstream-gerbil/src/std/encoding/json/json-test.ss \
            upstream-gerbil/src/std/os/socket-test.ss \
            upstream-gerbil/src/std/ensemble/ucan/did-test.ss \
            upstream-gerbil/src/std/ensemble/ucan/context-test.ss \
            upstream-gerbil/src/std/ensemble/network/auth-test.ss \
            | tee "$test_log"
          [[ "$(grep -c '^MODULE-OK ' "$test_log")" -eq 6 ]]
          [[ "$(grep -c '^HARNESS-OK ' "$test_log")" -eq 1 ]]
          ! grep -F 'ERROR' "$test_log"

      - name: Save exact release toolchain
        if: steps.gerbil-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.GERBIL_PREFIX }}
          key: gerbil-release-v0.19-full-v4-${{ inputs.platform }}-${{ env.GERBIL_BUILD_PROFILE }}-${{ steps.upstream.outputs.sha }}-${{ steps.upstream.outputs.patchset_sha }}

      - name: Verify source toolchain
        shell: bash
        env:
          SINGLE_HOST_MODE: unlimited
        run: |
          set -euo pipefail
          cp tools/release/activate-gerbil.sh "$GERBIL_PREFIX/activate"
          chmod +x "$GERBIL_PREFIX/activate"
          source "$GERBIL_PREFIX/activate"
          expected_sha="${{ steps.upstream.outputs.sha }}"
          [[ "$(gxi -v)" == *"${expected_sha:0:7}"* ]]
          jq -e \
            --arg sourceRevision "${{ steps.upstream.outputs.sha }}" \
            --arg stagingRevision "${{ steps.upstream.outputs.staging_sha }}" \
            --arg ensembleRevision "${{ steps.upstream.outputs.ensemble_sha }}" \
            --arg profile "$GERBIL_BUILD_PROFILE" \
            --arg patchsetSha "$GERBIL_PATCHSET_SHA" \
            '.schema == "gerbil-bazel.build-receipt.v1" and
             .sourceRevision == $sourceRevision and
             .stagingRevision == $stagingRevision and
             .ensembleRevision == $ensembleRevision and
             .profile == $profile and
             .patchsetSha == $patchsetSha and
             (.configureArguments | type == "array")' \
            "$GERBIL_PREFIX/gerbil-build-receipt.json"
          if [[ "$GERBIL_BUILD_PROFILE" == gcc16-* ]]; then
            openssl_pkgconfig="$(brew --prefix openssl@3)/lib/pkgconfig"
            sqlite_pkgconfig="$(brew --prefix sqlite)/lib/pkgconfig"
            zlib_pkgconfig="$(brew --prefix zlib)/lib/pkgconfig"
            jq -e \
              --arg singleHostMode "$SINGLE_HOST_MODE" \
              --arg opensslPkgconfig "$openssl_pkgconfig" \
              --arg sqlitePkgconfig "$sqlite_pkgconfig" \
              --arg zlibPkgconfig "$zlib_pkgconfig" \
              '(.singleHostMode == $singleHostMode) and
               (["--enable-march=", "--enable-smp", "--enable-gcc-opts"] -
                .configureArguments | length == 0) and
               (.environment.cFlags | contains("-pipe")) and
               (.environment.pkgConfigPath | contains($opensslPkgconfig)) and
               (.environment.pkgConfigPath | contains($sqlitePkgconfig)) and
               (.environment.pkgConfigPath | contains($zlibPkgconfig))' \
              "$GERBIL_PREFIX/gerbil-build-receipt.json"
          fi
          jq -e \
            '.singleHostMode == "unlimited" and
             (.configureArguments | any(. == "--enable-single-host=0"))' \
            "$GERBIL_PREFIX/gerbil-build-receipt.json"
          if [[ "$GERBIL_BUILD_PROFILE" == portable-* ]]; then
            jq -e '(.configureArguments | any(. == "--enable-march="))' \
              "$GERBIL_PREFIX/gerbil-build-receipt.json"
            if grep -F -- '-march=native' "$GERBIL_HOME/bin/gambuild-C"; then
              echo "installed Linux toolchain contains runner-specific -march=native" >&2
              exit 1
            fi
          fi
          if [[ "$GERBIL_BUILD_PROFILE" == *-aot-tools-* ]]; then
            jq -e '.toolLinkage == "whole-program-aot"' \
              "$GERBIL_PREFIX/gerbil-build-receipt.json"
            for tool in gxpkg gxtags; do
              [[ -x "$GERBIL_HOME/bin/$tool" ]]
              [[ ! -L "$GERBIL_HOME/bin/$tool" ]]
            done
          fi
          /usr/bin/time -p gxpkg version
          /usr/bin/time -p gxtags --help >/dev/null
          gxi -e '(begin (import :std/make) (displayln "std/make import ready"))'
          gxi -e '(begin
            (import :std/encoding/json)
            (##set-max-heap! 134217728)
            (let* ((value (make-string 100000 #\a))
                   (encoded (json->string value)))
              (unless (and (= (string-length encoded) 100002)
                           (equal? (string->json encoded) value))
                (error "buffered JSON memory writer regression")))
            (displayln "buffered JSON memory writer ready"))'
          if [[ "$GERBIL_BUILD_PROFILE" == gcc16-* ]]; then
            for cores in 1 3; do
              GERBIL_BUILD_CORES="$cores" \
                gxi patches/gerbil-v19-darwin/tests/compiler-executor-contract.ss
            done
            env -u GERBIL_BUILD_CORES \
              gxi patches/gerbil-v19-darwin/tests/compiler-executor-contract.ss
          fi

      - name: Package relocatable capability
        shell: bash
        run: |
          set -euo pipefail
          release_root="$RUNNER_TEMP/release"
          capability_name="gerbil-v0.19-${{ inputs.platform }}"
          capability="$release_root/$capability_name"
          mkdir -p "$capability"
          cp -a "$GERBIL_PREFIX/." "$capability/"
          version="$(
            source "$capability/activate"
            gxi -v
          )"
          jq -n \
            --arg schema gerbil-bazel.toolchain-release.v1 \
            --arg version "$version" \
            --arg upstreamRevision "${{ steps.upstream.outputs.sha }}" \
            --arg stagingRevision "${{ steps.upstream.outputs.staging_sha }}" \
            --arg ensembleRevision "${{ steps.upstream.outputs.ensemble_sha }}" \
            --arg os "${{ steps.upstream.outputs.os }}" \
            --arg arch "${{ steps.upstream.outputs.arch }}" \
            --arg buildProfile "$GERBIL_BUILD_PROFILE" \
            --arg patchsetSha "$GERBIL_PATCHSET_SHA" \
            '{schema: $schema, version: $version,
              upstreamRevision: $upstreamRevision,
              stagingRevision: $stagingRevision,
              ensembleRevision: $ensembleRevision,
              patchsetSha: $patchsetSha,
              platform: {os: $os, arch: $arch},
              buildProfile: $buildProfile,
              activation: "source ./activate"}' \
            > "$capability/gerbil-toolchain-release.json"
          tar -czf "$release_root/$RELEASE_ARCHIVE" -C "$release_root" "$capability_name"
          (
            cd "$release_root"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$RELEASE_ARCHIVE" > "$RELEASE_ARCHIVE.sha256"
            else
              shasum -a 256 "$RELEASE_ARCHIVE" > "$RELEASE_ARCHIVE.sha256"
            fi
          )

      - name: Verify relocated release bytes
        shell: bash
        run: |
          set -euo pipefail
          verify_root="$RUNNER_TEMP/relocated-release"
          mkdir -p "$verify_root"
          tar -xzf "$RUNNER_TEMP/release/$RELEASE_ARCHIVE" -C "$verify_root"
          source "$verify_root/gerbil-v0.19-${{ inputs.platform }}/activate"
          expected_sha="${{ steps.upstream.outputs.sha }}"
          [[ "$(gxi -v)" == *"${expected_sha:0:7}"* ]]
          jq -e \
            --arg sourceRevision "${{ steps.upstream.outputs.sha }}" \
            --arg stagingRevision "${{ steps.upstream.outputs.staging_sha }}" \
            --arg ensembleRevision "${{ steps.upstream.outputs.ensemble_sha }}" \
            --arg profile "$GERBIL_BUILD_PROFILE" \
            --arg patchsetSha "$GERBIL_PATCHSET_SHA" \
            '.sourceRevision == $sourceRevision and
             .stagingRevision == $stagingRevision and
             .ensembleRevision == $ensembleRevision and
             .profile == $profile and
             .patchsetSha == $patchsetSha' \
            "$verify_root/gerbil-v0.19-${{ inputs.platform }}/gerbil-build-receipt.json"
          gxi -e '(begin (import :std/make) (displayln "relocated std/make ready"))'
          /usr/bin/time -p gxpkg version
          /usr/bin/time -p gxtags --help >/dev/null

      - name: Publish immutable central release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "immutable release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/release/$RELEASE_ARCHIVE" \
            "$RUNNER_TEMP/release/$RELEASE_ARCHIVE.sha256" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TAG" \
            --notes "Central Gerbil v0.19 ${{ inputs.platform }} capability at ${{ steps.upstream.outputs.sha }} using profile $GERBIL_BUILD_PROFILE. Source the bundled activate file after extraction; inspect gerbil-build-receipt.json for the exact compiler and configure arguments."
